<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Law Firm Listings">
  <!--
    Full bleed on purpose. A favicon is rendered at 16 or 32 pixels in a tab strip, and the
    previous one spent that budget on a rounded rectangle, a shield outline and a tick: at 16px
    the tick was two pixels and the shield read as a smudge. A solid field of colour survives the
    size, and the site's own gradient is the thing a reader has already seen on every badge, every
    eyebrow dot and the certification ring.

    The diagonal rather than the site's horizontal 90deg: across 16 pixels a left-to-right ramp
    shows perhaps three steps, where corner to corner shows the whole run.

    It also drops fourteen kilobytes of C2PA manifest that the old file carried inside a 32-pixel
    icon, and which announced on every page load that the icon had been generated rather than
    designed.
  -->
  <defs>
    <linearGradient id="lfl" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#lfl)"/>
</svg>
